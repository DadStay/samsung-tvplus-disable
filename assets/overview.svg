<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400"><rect width="1100" height="400" rx="20" fill="#0d1425"/><g font-family="sans-serif" fill="#edf2ff"><text x="52" y="65" font-size="32" font-weight="bold">Samsung TV Plus Disable</text><text x="52" y="101" font-size="20" fill="#afbdd8">A focused playback block. Your apps and HDMI stay in place.</text><rect x="52" y="142" width="300" height="158" rx="14" fill="#1a2942"/><text x="76" y="183" font-size="22">1. Check your target</text><text x="76" y="222" font-size="18" fill="#afbdd8">Exact model + firmware</text><text x="76" y="254" font-size="18" fill="#afbdd8">Refuse unsupported TVs</text><rect x="400" y="142" width="300" height="158" rx="14" fill="#173b39"/><text x="424" y="183" font-size="22">2. Block playback</text><text x="424" y="222" font-size="18" fill="#bde6db">Save original BMS state</text><text x="424" y="254" font-size="18" fill="#bde6db">Use native service condition</text><rect x="748" y="142" width="300" height="158" rx="14" fill="#1a2942"/><text x="772" y="183" font-size="22">3. Hide + verify</text><text x="772" y="222" font-size="18" fill="#afbdd8">Native Home Disable menu</text><text x="772" y="254" font-size="18" fill="#afbdd8">Reboot, test apps + HDMI</text><text x="52" y="353" font-size="19" fill="#f6d49c">Known limit: channel titles and the disabled-service notice can remain.</text></g></svg>